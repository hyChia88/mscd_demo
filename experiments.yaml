# Experiment Configuration for Master Thesis
# Each experiment has a unique name, description, and parameters

experiments:
  # Baseline: V2 without VLM (before fix)
  baseline_v2:
    description: "V2 constraints-driven pipeline without VLM image parsing"
    profile: v2_prompt
    conditions: [A1, B1, C1]
    cases: ../data_curation/datasets/synth_v0.2/cases_v2.jsonl
    output_dir: logs/experiments/baseline_v2
    tags: [baseline, no-vlm]
    git_ref: null  # Use current code

  # Main experiment: V2 with VLM fix
  vlm_integration:
    description: "V2 pipeline with Gemini VLM for image parsing (THE FIX)"
    profile: v2_prompt
    conditions: [A1, B1, C1]
    cases: ../data_curation/datasets/synth_v0.2/cases_v2.jsonl
    output_dir: logs/experiments/vlm_integration
    tags: [main, vlm-enabled]
    git_ref: null  # Use current code

  # Extended test: All conditions
  vlm_full_test:
    description: "Full evaluation across all 9 conditions (A1-C3)"
    profile: v2_prompt
    conditions: [A1, A2, A3, B1, B2, B3, C1, C2, C3]
    cases: ../data_curation/datasets/synth_v0.2/cases_v2.jsonl
    output_dir: logs/experiments/vlm_full
    tags: [comprehensive, vlm-enabled]
    git_ref: null

  # Ablation study: Images vs Floorplan
  ablation_images_only:
    description: "Ablation: VLM on images only (B conditions)"
    profile: v2_prompt
    conditions: [B1, B2, B3]
    cases: ../data_curation/datasets/synth_v0.2/cases_v2.jsonl
    output_dir: logs/experiments/ablation_images
    tags: [ablation, images-only]
    git_ref: null

  ablation_floorplan_only:
    description: "Ablation: VLM on floorplan only (C conditions)"
    profile: v2_prompt
    conditions: [C1, C2, C3]
    cases: ../data_curation/datasets/synth_v0.2/cases_v2.jsonl
    output_dir: logs/experiments/ablation_floorplan
    tags: [ablation, floorplan-only]
    git_ref: null

  # Quick test: Subset for debugging
  quick_test:
    description: "Quick test with 5 cases for debugging"
    profile: v2_prompt
    conditions: [B1]
    cases: ../data_curation/datasets/synth_v0.2/cases_v2.jsonl
    output_dir: logs/experiments/quick_test
    limit: 5
    tags: [debug, quick]
    git_ref: null

  # Quick test with percentage sampling
  quick_test_40pct:
    description: "Quick test with 40% of dataset (scales with dataset size)"
    profile: v2_prompt
    conditions: [A1, A2, A3, B1, B2, B3, C1, C2, C3]
    cases: ../data_curation/datasets/synth_v0.2/cases_v2.jsonl
    output_dir: logs/experiments/quick_test_40pct
    percent: 40  # Use 40% of data
    tags: [debug, quick, percentage]
    git_ref: null

  # V1 vs V2 comparison experiments (ALL 9 CONDITIONS)
  v1_baseline_test:
    description: "V1 agent-driven pipeline across all conditions (A1-C3)"
    profile: v1_baseline
    conditions: [A1, A2, A3, B1, B2, B3, C1, C2, C3]
    cases: ../data_curation/datasets/synth_v0.2/cases_v2.jsonl
    output_dir: logs/experiments/v1_baseline_test
    tags: [v1, baseline, comparison, comprehensive]
    git_ref: null

  v2_prompt_test:
    description: "V2 constraints-driven pipeline across all conditions (A1-C3)"
    profile: v2_prompt
    conditions: [A1, A2, A3, B1, B2, B3, C1, C2, C3]
    cases: ../data_curation/datasets/synth_v0.2/cases_v2.jsonl
    output_dir: logs/experiments/v2_prompt_test
    tags: [v2, comparison, comprehensive]
    git_ref: null

  # ===========================================================================
  # SYNTH V0.3 EXPERIMENTS (84 cases, harder dataset)
  # ===========================================================================

  # V1 baseline on synth_v0.3
  v1_baseline_v03:
    description: "V1 agent-driven pipeline on synth_v0.3 (84 cases)"
    profile: v1_baseline
    conditions: []  # All conditions (no filter)
    cases: ../data_curation/datasets/synth_v0.3/cases_v3_filtered.jsonl
    output_dir: logs/evaluations
    tags: [v1, baseline, synth_v0.3]

  # V2 prompt baseline on synth_v0.3 (already run — Exp 3)
  v2_prompt_v03:
    description: "V2 prompt-only on synth_v0.3 (84 cases)"
    profile: v2_prompt
    conditions: []  # All conditions
    cases: ../data_curation/datasets/synth_v0.3/cases_v3_filtered.jsonl
    output_dir: logs/evaluations
    tags: [v2, prompt, synth_v0.3]
    existing_traces: logs/evaluations/traces_20260214_210555_v2_prompt.jsonl

  # V2 LoRA (final adapter) on synth_v0.3
  v2_lora_final_v03:
    description: "V2 LoRA (final adapter) on synth_v0.3 (84 cases)"
    profile: v2_lora
    conditions: []
    cases: ../data_curation/datasets/synth_v0.3/cases_v3_filtered.jsonl
    output_dir: logs/evaluations
    precomputed: logs/evaluations/eval_constraints_final.jsonl
    tags: [v2, lora, final, synth_v0.3]

  # V2 LoRA (checkpoint-180) on synth_v0.3
  v2_lora_ckpt180_v03:
    description: "V2 LoRA (checkpoint-180) on synth_v0.3 (84 cases)"
    profile: v2_lora
    conditions: []
    cases: ../data_curation/datasets/synth_v0.3/cases_v3_filtered.jsonl
    output_dir: logs/evaluations
    precomputed: logs/evaluations/eval_constraints_checkpoint-180.jsonl
    tags: [v2, lora, ckpt180, synth_v0.3]

  # ===========================================================================
  # MODALITY × 4D ABLATION (synth_v0.4)
  # Six runs: MA/MB/MC (4D ON) + MA-/MB-/MC- (4D OFF)
  # Isolates the pure contribution of 4D project context at each modality level.
  # Visualised by: python script/generate_plots.py --modality (Chart 12)
  # ===========================================================================

  modality_4d_ablation_lora:
    description: "4D ablation: MA/MB/MC vs MA-/MB-/MC- (LoRA, synth_v0.4_merged) — isolates 4D context impact"
    profile: v2_lora
    adapter_path: models/adapters/v2_lora_qwen/final
    # condition_overrides uses --condition-override (applies one condition to ALL cases)
    # This is required for MA/MB/MC-style runs where cases lack those bench.condition labels.
    condition_overrides: [MA, MB, MC, "MA-", "MB-", "MC-"]
    cases: ../data_curation/datasets/synth_v0.4_merged/train/test_holdout.jsonl
    output_dir: logs/evaluations/synth_v04
    tags: [modality, 4d-ablation, v2, lora, synth_v0.4_merged]

  modality_4d_ablation_prompt:
    description: "4D ablation: MA/MB/MC vs MA-/MB-/MC- (Prompt, synth_v0.4_merged) — isolates 4D context impact"
    profile: v2_prompt
    condition_overrides: [MA, MB, MC, "MA-", "MB-", "MC-"]
    cases: ../data_curation/datasets/synth_v0.4_merged/train/test_holdout.jsonl
    output_dir: logs/evaluations/synth_v04
    tags: [modality, 4d-ablation, v2, prompt, synth_v0.4_merged]

  # ===========================================================================
  # FULL 6-CONDITION MODALITY ABLATION × 2 PROFILES (primary experiment)
  # MA/MB/MC (4D ON) + MA-/MB-/MC- (4D OFF) × LoRA + Prompt = 12 runs
  # Uses test_holdout_with_images.jsonl (50/50 cases, all assets complete)
  # Visualised by: python script/generate_plots.py --modality (Chart 13)
  # ===========================================================================

  modality_6cond_lora:
    description: "Full 6-condition modality ablation — LoRA (synth_v0.4_merged, 50 cases)"
    profile: v2_lora
    adapter_path: models/adapters/v2_lora_qwen/final
    condition_overrides: [MA, MB, MC, "MA-", "MB-", "MC-"]
    cases: ../data_curation/datasets/synth_v0.4_merged/train/test_holdout_with_images.jsonl
    output_dir: logs/evaluations/synth_v04
    # Per-condition precomputed files from Modal LoRA inference.
    # Run on Modal:  modal run training/eval.py --condition-override <COND>
    # Download:      modal volume get mscd-checkpoints \
    #                  /mscd-lora/eval_constraints_final_<COND>.jsonl \
    #                  logs/evaluations/synth_v04/precomputed/
    precomputed_map:
      MA:   logs/evaluations/synth_v04/precomputed/eval_constraints_final_MA.jsonl
      MB:   logs/evaluations/synth_v04/precomputed/eval_constraints_final_MB.jsonl
      MC:   logs/evaluations/synth_v04/precomputed/eval_constraints_final_MC.jsonl
      "MA-": logs/evaluations/synth_v04/precomputed/eval_constraints_final_MA-.jsonl
      "MB-": logs/evaluations/synth_v04/precomputed/eval_constraints_final_MB-.jsonl
      "MC-": logs/evaluations/synth_v04/precomputed/eval_constraints_final_MC-.jsonl
    tags: [modality, 6cond, v2, lora, synth_v0.4_merged]

  modality_6cond_prompt:
    description: "Full 6-condition modality ablation — Prompt (synth_v0.4_merged, 50 cases)"
    profile: v2_prompt
    condition_overrides: [MA, MB, MC, "MA-", "MB-", "MC-"]
    cases: ../data_curation/datasets/synth_v0.4_merged/train/test_holdout_with_images.jsonl
    output_dir: logs/evaluations/synth_v04
    tags: [modality, 6cond, v2, prompt, synth_v0.4_merged]

# Comparison groups - define which experiments to compare
comparisons:
  vlm_impact:
    description: "Before/After VLM Integration"
    before: baseline_v2
    after: vlm_integration
    output_dir: logs/comparisons/vlm_impact

  ablation_study:
    description: "Images vs Floorplan VLM effectiveness"
    experiments: [ablation_images_only, ablation_floorplan_only]
    output_dir: logs/comparisons/ablation

  v1_vs_v2:
    description: "V1 Agent-Driven vs V2 Constraints-Driven Pipeline Comparison"
    before: v1_baseline_test
    after: v2_prompt_test
    output_dir: logs/comparisons/v1_vs_v2

  # synth_v0.3: V1 vs V2-prompt vs V2-LoRA (4-way comparison)
  v03_full_comparison:
    description: "V1 vs V2-Prompt vs V2-LoRA-Final vs V2-LoRA-Ckpt180 on synth_v0.3"
    experiments: [v1_baseline_v03, v2_prompt_v03, v2_lora_final_v03, v2_lora_ckpt180_v03]
    output_dir: logs/comparisons/v03_full

# Metadata tracking
tracking:
  log_git_info: true      # Record git commit, branch, diff
  log_conda_env: true     # Record conda environment
  log_timestamps: true    # Record start/end times
  save_config: true       # Save experiment config with results
