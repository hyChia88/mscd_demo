        .cell { transition: fill 0.5s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.2s; cursor: pointer; }
        .cell:hover { stroke: #3b82f6 !important; stroke-width: 2px !important; }
        .cell-selected { stroke: #000 !important; stroke-width: 2.5px !important; z-index: 50; filter: drop-shadow(0 0 8px rgba(0,0,0,0.2)); }
        
        .ingestion-particle {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            pointer-events: none; z-index: 100; transition: all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 0; box-shadow: 0 0 8px currentColor;
        }

        .bim-base { pointer-events: none; }
        .step-pill { font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-family: monospace; }
        
        svg { max-width: 100%; max-height: 100%; width: 100%; height: 100%; }
    </style>
</head>

        window.onload = () => { renderBIM(); initGrid(); switchMode(); };

        function renderBIM() {
            const layer = document.getElementById('layer-floorplan');
            bimElements.forEach(el => {
                const geom = document.createElementNS("http://www.w3.org/2000/svg", el.svgType);
                for (const [key, value] of Object.entries(el.attrs)) { geom.setAttribute(key, value); }
                geom.setAttribute('fill', el.hasData ? '#f0f9ff' : '#f8fafc');
                geom.setAttribute('stroke', '#cbd5e1');
                geom.setAttribute('class', 'bim-base');
                layer.appendChild(geom);
            });
        }

        function initGrid() {
            const layer = document.getElementById('layer-grid');
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    rect.setAttribute("x", c * cellSize); rect.setAttribute("y", r * cellSize);
                    rect.setAttribute("width", cellSize); rect.setAttribute("height", cellSize);
                    rect.setAttribute("fill", "transparent"); rect.setAttribute("stroke", "rgba(0,0,0,0.01)");
                    rect.setAttribute("class", "cell"); rect.setAttribute("id", `cell-${c}-${r}`);
                    rect.onclick = () => handleCellClick(c, r);
                    layer.appendChild(rect);
                }
            }
        }

        function switchMode() {
            const mode = document.getElementById('mode-selector').value;
            const legend = document.getElementById('legend');
            
            if (mode === 'defect') legend.innerHTML = `<div class="flex items-center gap-1"><div class="w-2 h-2 bg-red-600 rounded-sm"></div> Sentiment Toxicity</div>`;
            else if (mode === 'conflict') legend.innerHTML = `<div class="flex items-center gap-1"><div class="w-2 h-2 bg-purple-600 rounded-sm"></div> Trade Contradiction</div>`;
            else legend.innerHTML = `<div class="flex items-center gap-1"><div class="w-2.5 h-2.5 border border-slate-400" style="background: url(#hashPattern)"></div> Milestone Blindspot</div>`;

            activeNodes.forEach(node => {
                const cell = document.getElementById(`cell-${node.c}-${node.r}`);
                if (mode === 'blindspot') {
                    cell.setAttribute('fill', node.b > 0.7 ? 'url(#hashPattern)' : 'transparent');
                } else if (mode === 'conflict') {
                    cell.setAttribute('fill', `rgba(147, 51, 234, ${node.cnf})`);
                } else {
                    cell.setAttribute('fill', `rgba(220, 38, 38, ${node.d})`);
                }
            });
        }

        function startLiveIngestion() {
            const ticker = document.getElementById('incoming-ticker');
            if (ticker.innerText.includes('[AWAITING')) ticker.innerHTML = '';
            scenarios.forEach((s, i) => {
                setTimeout(() => {
                    addTickerItem(s);
                    animateGrounding(s);
                    activeNodes.push(s);
                }, i * 600);
            });
        }

        function addTickerItem(s) {
            const ticker = document.getElementById('incoming-ticker');
            const card = document.createElement('div');
            card.className = "bg-white p-3 rounded border border-slate-200 shadow-sm animate-in slide-in-from-left duration-500 border-l-4";
            card.style.borderLeftColor = s.b > 0.8 ? '#94a3b8' : (s.cnf > 0.8 ? '#a855f7' : '#ef4444');
            card.innerHTML = `<div class="flex justify-between items-center mb-1"><span class="text-[9px] font-bold font-mono uppercase tracking-widest text-slate-500">${s.s}</span></div><p class="text-[11px] leading-relaxed italic text-slate-700">"${s.text}"</p>`;
            ticker.prepend(card);
        }

        function animateGrounding(s) {
            const particle = document.createElement('div');
            particle.className = "ingestion-particle";
            particle.style.backgroundColor = s.b > 0.8 ? '#94a3b8' : (s.cnf > 0.8 ? '#a855f7' : '#ef4444');
            const tickerRect = document.getElementById('incoming-ticker').getBoundingClientRect();
            const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
            particle.style.left = (tickerRect.left + 40) + 'px'; particle.style.top = (tickerRect.top + 100) + 'px';
            document.body.appendChild(particle);
            const targetX = canvasRect.left + (s.c * cellSize) + (cellSize / 2);
            const targetY = canvasRect.top + (s.r * cellSize) + (cellSize / 2);
            setTimeout(() => {
                particle.style.opacity = '1';
                particle.style.transform = `translate(${targetX - (tickerRect.left + 40)}px, ${targetY - (tickerRect.top + 100)}px) scale(1.5)`;
                setTimeout(() => {
                    particle.remove();
                    const cell = document.getElementById(`cell-${s.c}-${s.r}`);
                    const mode = document.getElementById('mode-selector').value;
                    if (mode === 'blindspot') cell.setAttribute('fill', s.b > 0.7 ? 'url(#hashPattern)' : 'transparent');
                    else if (mode === 'conflict') cell.setAttribute('fill', `rgba(147, 51, 234, ${s.cnf})`);
                    else cell.setAttribute('fill', `rgba(220, 38, 38, ${s.d})`);
                    cell.dataset.reason = s.rsn; cell.dataset.text = s.text; cell.dataset.el = s.el;
                }, 700);
            }, 50);
        }

        function handleCellClick(c, r) {
            if(selectedCell) document.getElementById(`cell-${selectedCell.c}-${selectedCell.r}`).classList.remove('cell-selected');
            const cell = document.getElementById(`cell-${c}-${r}`);
            cell.classList.add('cell-selected'); selectedCell = {c, r};
            const content = document.getElementById('reasoning-content');
            if (!cell.dataset.reason) {
                content.innerHTML = `<div class="p-6 bg-slate-50 rounded border border-dashed border-slate-200 text-center text-[10px] font-mono text-slate-400 mt-20 uppercase tracking-widest">GRID_NODE_${c}_${r}<br>NO EMERGENT ANOMALY</div>`;
                return;
            }
            content.innerHTML = `
                <div class="animate-in fade-in slide-in-from-right-4 duration-300">
                    <h3 class="font-bold text-slate-900 text-sm mb-4 uppercase flex justify-between"><span>Logic Trace</span><span class="text-[9px] font-mono text-slate-400 bg-slate-100 px-1 rounded">${cell.dataset.el}</span></h3>
                    <div class="space-y-4">
                        <div class="bg-slate-900 p-4 rounded shadow-lg"><p class="text-[9px] text-blue-400 font-bold font-mono uppercase mb-1">Raw Evidence Grounded</p><p class="text-[11px] text-white leading-relaxed italic mb-2">"${cell.dataset.text}"</p></div>
                        <div class="relative pl-6 border-l-2 border-blue-500"><div class="absolute -left-[5px] top-0 w-2 h-2 bg-blue-500 rounded-full"></div><span class="text-[9px] font-bold text-blue-500 uppercase font-mono block mb-1">Synthesis Path</span><p class="text-[11px] text-slate-800 font-bold leading-tight">${cell.dataset.reason}</p></div>
                        <div class="p-3 bg-emerald-50 border border-emerald-100 rounded text-[10px] font-mono leading-relaxed text-emerald-800 italic uppercase">[GROUNDING CONFIDENCE: 0.94]</div>
                    </div>
                </div>
            `;
        }
